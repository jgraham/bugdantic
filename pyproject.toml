[project]
name = "bugdantic"
description = "Bugzilla client based on pydantic"
authors = [
  {name = "James Graham", email = "james@hoppipolla.co.uk"}
]

version = "0.4.2"
requires-python = ">=3.11"
license = "MPL-2.0"
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "httpx[http2]>=0.28.1",
  "pydantic>=2.11.3",
]

[project.optional-dependencies]
test = [
  "mypy==2.3.0",
  "ruff==0.16.2",
  "pytest==9.1.1",
  "pytest-ruff==0.5",
  "ty==0.0.71",
]

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff.lint]
ignore = ["UP045", "LOG015"]
